name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  nilaway:
    name: Nilaway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install nilaway
        run: go install go.uber.org/nilaway/cmd/nilaway@v0.0.0-20260918162853-acb8859b9031

      - name: Run nilaway
        run: |
          NILAWAY_BASELINE=0
          set +e
          nilaway -include-pkgs="github.com/smykla-skalski/bilgie" ./... > nilaway.out 2>&1
          NILAWAY_EXIT=$?
          FINDING_COUNT=$(grep -c '^/' nilaway.out)
          set -e
          if [ "$NILAWAY_EXIT" -ne 0 ] && [ "$FINDING_COUNT" -eq 0 ]; then
            echo "::error::Nilaway exited ${NILAWAY_EXIT} with no parseable findings — crash or package-load failure."
            cat nilaway.out >&2
            exit "$NILAWAY_EXIT"
          fi
          {
            echo "### Nilaway findings"
            echo
            if [ "$FINDING_COUNT" -eq 0 ]; then
              echo "_No issues._"
            else
              echo "<details><summary>${FINDING_COUNT} findings (baseline: ${NILAWAY_BASELINE})</summary>"
              echo
              echo '```'
              cat nilaway.out
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FINDING_COUNT" -gt "$NILAWAY_BASELINE" ]; then
            echo "::error::Nilaway: ${FINDING_COUNT} findings exceeds baseline of ${NILAWAY_BASELINE}. Fix new nil-safety regressions before merging."
            exit 1
          fi
          echo "Nilaway: ${FINDING_COUNT}/${NILAWAY_BASELINE} findings — OK"

  test-matrix:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Check coverage
        run: go tool cover -func=coverage.out

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: |
          set +e
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... > govulncheck.out 2>&1
          VULN_EXIT=$?
          set -e
          {
            echo "### govulncheck"
            echo
            echo '```'
            cat govulncheck.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$VULN_EXIT" -ne 0 ]; then
            echo "::error::govulncheck found reachable vulnerabilities."
            cat govulncheck.out >&2
            exit "$VULN_EXIT"
          fi
          echo "govulncheck: no reachable vulnerabilities — OK"

  build-matrix:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build binary
        run: |
          BIN=./bilgie
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=./bilgie.exe; fi
          go build -v -o "$BIN" ./cmd/bilgie

      - name: Verify binary
        run: |
          BIN=./bilgie
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=./bilgie.exe; fi
          OUT=$("$BIN" --version)
          echo "$OUT"
          [ -n "$OUT" ]

  test:
    name: Test
    if: always()
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Require all test legs
        run: |
          [ "${{ needs.test-matrix.result }}" = "success" ]

  build:
    name: Build
    if: always()
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Require all build legs
        run: |
          [ "${{ needs.build-matrix.result }}" = "success" ]
